# Checks every pull request and every push to main. Deploys are handled elsewhere:
# Vercel builds the website, the Play upload is manual (docs/play-store/README.md).
#
# Actions are pinned to full commit SHAs (the tag they correspond to is in the comment) so
# a moved tag can't change what runs here. To update one, look up the new tag's commit
# (`gh api repos/<owner>/<repo>/tags`) and change both the SHA and the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The build doesn't call Supabase; real values come from Vercel at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Visible but non-blocking: the output is in the log, and the step never fails the job.
      # Production dependencies regularly carry advisories that have no released fix yet, or
      # sit in transitive packages we can't bump on our own, so a blocking audit would stop
      # unrelated changes from merging. Read it on every run and fix what has a fix; make it
      # blocking (drop `|| true`) once the baseline is clean.
      - name: npm audit (production dependencies, high and above; informational)
        run: npm audit --omit=dev --audit-level=high || true
      - run: npm run lint
      - run: npm run typecheck
      # Includes the check that web-written payloads match the app's newest Room schema.
      - run: npm test
      - run: npm run build

  # The app checks run as parallel jobs on separate runners. Each compiles what it needs
  # itself (the build cache from main covers what a change didn't touch), so a change low in
  # the module graph costs about as long as the slowest job instead of all of them in a row.
  # The required status check is the `App` job at the end, which passes only if all of them
  # did, so the branch ruleset doesn't change when jobs are added or renamed.

  # Unit tests, and screenshot tests against the committed goldens. `verifyRoborazziDebug`
  # runs a module's testDebugUnitTest in verify mode, so each test runs once.
  app-tests:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle's dependency and build caches between runs.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Without local.properties the build has no Supabase config, so sync is simply off.
      - run: ./gradlew testDebugUnitTest :core:data:testAndroidHostTest :core:engine:jvmTest :core:model:jvmTest verifyRoborazziDebug
      # On failure, keep the screenshot comparisons (actual, expected and diff images) so
      # they can be inspected without re-running locally.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-diffs
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  app-lint:
    name: App lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew :app:lintRelease
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.*"
          if-no-files-found: ignore
          retention-days: 14

  # Both builds, one per job. assembleRelease is debug-signed here (no keystore.properties)
  # and exists to prove that the R8 shrink and resource-shrink step still succeeds; it is not
  # uploadable.
  app-build:
    name: App build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            tasks: assembleDebug
          - variant: release
            tasks: :app:assembleRelease
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew ${{ matrix.tasks }}

  # The multiplatform modules' tests again, compiled for iOS and run in the iOS simulator, so
  # code that only works on the JVM can't land in shared code. Needs a macOS runner (Xcode).
  shared-ios:
    name: Shared code on iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew :core:model:iosSimulatorArm64Test :core:engine:iosSimulatorArm64Test :core:data:iosSimulatorArm64Test

  # The required check. `always()` makes it run (and fail) when a job above failed or was
  # cancelled; without it this job would be skipped, and a skipped check counts as passing.
  android:
    name: App
    if: always()
    needs: [app-tests, app-lint, app-build, shared-ios]
    runs-on: ubuntu-latest
    steps:
      - name: All app jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
