# Checks every pull request and every push to main. Deploys are handled elsewhere:
# Vercel builds the website, the Play upload is manual (docs/play-store/README.md).
#
# Actions are pinned to full commit SHAs (the tag they correspond to is in the comment) so
# a moved tag can't change what runs here. To update one, look up the new tag's commit
# (`gh api repos/<owner>/<repo>/tags`) and change both the SHA and the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes anything a check reads. Only Markdown files and .claude/ count
  # as docs, and not the privacy policy, which the website builds into /privacy
  # (web/scripts/copy-shared.mjs). A docs-only pull request skips every job below; a push to main
  # always runs everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          code=$(printf '%s\n' "$changed" | grep -vE '\.md$|^\.claude/' | grep -v '^$' || true)
          policy=$(printf '%s\n' "$changed" | grep -xF 'docs/play-store/privacy-policy.md' || true)
          if [ -n "$code$policy" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  # Skipped on a docs-only pull request; GitHub counts a skipped required check as passing.
  web:
    name: Website
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The build doesn't call Supabase; real values come from Vercel at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Visible but non-blocking: the output is in the log, and the step never fails the job.
      # Production dependencies regularly carry advisories that have no released fix yet, or
      # sit in transitive packages we can't bump on our own, so a blocking audit would stop
      # unrelated changes from merging. Read it on every run and fix what has a fix; make it
      # blocking (drop `|| true`) once the baseline is clean.
      - name: npm audit (production dependencies, high and above; informational)
        run: npm audit --omit=dev --audit-level=high || true
      - run: npm run lint
      - run: npm run typecheck
      # Includes the check that web-written payloads match the app's newest Room schema.
      - run: npm test
      - run: npm run build

  # Every Android check in one job and one Gradle run, so each module compiles once for all of
  # them. (As four parallel jobs each compiled everything again and kept its own ~2 GB Gradle
  # cache; together they went over GitHub's 10 GB cache limit and evicted one another, so jobs
  # often started cold.) The required status check is the `App` job at the end, which passes
  # only if every job did, so the branch ruleset doesn't change when jobs are added or renamed.
  #
  # - Unit tests, and screenshot tests against the committed goldens (`verifyRoborazziDebug`
  #   runs a module's testDebugUnitTest in verify mode, so each test runs once).
  # - Lint on the release variant.
  # - The debug build, and on pushes to main the release build too. assembleRelease is
  #   debug-signed here (no keystore.properties) and exists to prove that the R8 shrink and
  #   resource-shrink step still succeeds; it is not uploadable. Pull requests leave it out
  #   (it only matters at release, and /release builds the real bundle), so it runs on main.
  # `--continue` runs every check even when one fails, so one run reports all failures.
  app:
    name: Android checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle's dependency and build caches between runs (written from main only).
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Without local.properties the build has no Supabase config, so sync is simply off.
      - run: >-
          ./gradlew --continue
          testDebugUnitTest :core:data:testAndroidHostTest :core:engine:jvmTest :core:model:jvmTest verifyRoborazziDebug
          :app:lintRelease
          assembleDebug ${{ github.event_name == 'push' && ':app:assembleRelease' || '' }}
      # On failure, keep the screenshot comparisons (actual, expected and diff images), test
      # reports and lint reports, so they can be inspected without re-running locally.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/tests/**
            **/build/reports/lint-results-*.*
          if-no-files-found: ignore
          retention-days: 14

  # The multiplatform modules' tests again, compiled for iOS and run in the iOS simulator, so
  # code that only works on the JVM can't land in shared code; then the iOS app itself, for the
  # simulator and unsigned (its build phase compiles the Kotlin framework). Needs a macOS runner.
  shared-ios:
    name: Shared code on iOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Kotlin/Native's compiler and, above all, its compiled caches of every library (Compose,
      # coroutines, Ktor, …). Without them each run rebuilt those caches while linking the test
      # binaries and the framework: about 12 of the job's 14 minutes. Restored on every run, saved
      # from main only (like Gradle's cache), so pull requests don't each store another copy.
      # The key changes with the Kotlin or library versions.
      - name: Restore Kotlin/Native caches
        id: konan
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-
      - run: ./gradlew :core:model:iosSimulatorArm64Test :core:engine:iosSimulatorArm64Test :core:data:iosSimulatorArm64Test :core:ui:iosSimulatorArm64Test
      - name: Build the iOS app
        run: xcodebuild -project iosApp/Spotter.xcodeproj -scheme Spotter -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Save Kotlin/Native caches
        if: github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

  # The database, built from scratch out of supabase/migrations/ on a local Supabase stack (never
  # production): every migration must apply in order, every supabase/tests/*.sql must pass
  # (including rls.sql: row-level security on every table, views that respect it, and so on), and
  # the website's generated types must match the schema, so a migration that changes a column the
  # website reads can't land without the types (and web/src/lib/supabase/schema-check.ts) following.
  database:
    name: Database
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # The same version that generated web/src/lib/supabase/database.types.ts; bump both together.
          version: 2.122.0
      - name: Apply every migration to an empty database
        run: supabase db start
      - name: SQL tests
        run: |
          for f in supabase/tests/*.sql; do
            echo "::group::$f"
            docker exec -i supabase_db_spotter psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -t < "$f"
            echo "::endgroup::"
          done
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local --schema public > web/src/lib/supabase/database.types.ts
          git diff --exit-code -- web/src/lib/supabase/database.types.ts || {
            echo "::error::web/src/lib/supabase/database.types.ts is out of date: run 'npm --prefix web run db:types' with the local stack running and commit the result."
            exit 1
          }

  # The required check. `always()` makes it run (and fail) when a job above failed or was
  # cancelled; without it this job would be skipped, and a skipped check counts as passing.
  android:
    name: App
    if: always()
    needs: [changes, app, shared-ios, database]
    runs-on: ubuntu-latest
    steps:
      # Skipped counts only when "What changed" ran and found docs alone.
      - name: All app jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ needs.app.result }} ${{ needs.shared-ios.result }} ${{ needs.database.result }}
        run: |
          echo "changes=$CHANGES code=$CODE jobs: $RESULTS"
          [ "$CHANGES" = success ] || exit 1
          for r in $RESULTS; do
            [ "$r" = success ] || { [ "$r" = skipped ] && [ "$CODE" = false ]; } || exit 1
          done
