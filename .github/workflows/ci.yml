# Checks every pull request and every push to main. Deploys are handled elsewhere:
# Vercel builds the website, the Play upload is manual (docs/play-store/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The build doesn't call Supabase; real values come from Vercel at deploy time.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the check that web-written payloads match the app's newest Room schema.
      - run: npm test
      - run: npm run build

  android:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Without local.properties the build has no Supabase config, so sync is simply off.
      - run: ./gradlew testDebugUnitTest assembleDebug
