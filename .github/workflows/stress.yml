# The sync stress test (core/data StressTest) at length: CI runs 8 seeds on every pull request,
# this runs 500 once a week, or as many as asked from the Actions tab. Each failing seed's
# report (what went wrong, the steps before it, the command that replays it) is uploaded.
# Actions are pinned to commit SHAs, as in ci.yml.
name: Stress

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds to run
        default: "500"
      steps:
        description: Steps per seed
        default: "150"

permissions:
  contents: read

jobs:
  stress:
    name: Sync stress test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # A different first seed each week, so the weekly runs don't repeat each other.
      - env:
          SEEDS: ${{ inputs.seeds || '500' }}
          STEPS: ${{ inputs.steps || '150' }}
        run: >-
          ./gradlew :core:data:testAndroidHostTest --tests '*StressTest*'
          -Pstress.seed=$(( $(date +%s) / 604800 * 1000 ))
          -Pstress.seeds="$SEEDS" -Pstress.steps="$STEPS"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-reports
          path: core/data/build/reports/stress/
          if-no-files-found: ignore
          retention-days: 30
