serialization = "1.11.0"
junit4 = "4.13.2"
androidxTestJunit = "1.3.0"
robolectric = "4.17"
vico = "3.3.1"
# Compose Multiplatform for the shared UI. On Android its artifacts resolve to the androidx ones,
# so keep it on the same Compose release as composeBom (material3 1.9 = androidx material3 1.4).
composeMultiplatform = "1.12.1"
composeMultiplatformMaterial3 = "1.9.0"
composeMultiplatformIcons = "1.7.3"
# Multiplatform lifecycle and navigation; on Android they resolve to the androidx artifacts above.
lifecycleMultiplatform = "2.11.0"
navigationMultiplatform = "2.10.0"
roborazzi = "1.76.0"
supabase = "3.8.0"
ktor = "3.6.0"
work = "2.12.0"
securityCrypto = "1.1.0"
multiplatformSettings = "1.3.0"
kotlinxDatetime = "0.8.0"
sqlite = "2.6.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
