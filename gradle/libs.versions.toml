[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
koin = "4.2.2"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
coreSplashscreen = "1.2.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
